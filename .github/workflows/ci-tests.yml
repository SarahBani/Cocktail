name: CI Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-tests.yml'

      - name: Setup Node.js
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: npm ci

      - name: Run tests
        if: steps.changes.outputs.backend == 'true'
        run: npm test -- --runInBand

      - name: Skip backend tests (no backend changes)
        if: steps.changes.outputs.backend != 'true'
        run: echo "No backend-related changes detected."

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-tests.yml'

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Run tests
        if: steps.changes.outputs.frontend == 'true'
        run: npm test -- --runInBand

      - name: Skip frontend tests (no frontend changes)
        if: steps.changes.outputs.frontend != 'true'
        run: echo "No frontend-related changes detected."

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci-tests.yml'

      - name: Setup Node.js
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: npm ci

      - name: Run integration tests
        if: steps.changes.outputs.backend == 'true'
        run: npm run test:e2e

      - name: Skip (no backend changes)
        if: steps.changes.outputs.backend != 'true'
        run: echo "No backend-related changes detected."

  frontend-e2e-tests:
    name: Frontend E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: frontend-tests
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci-tests.yml'

      - name: Run Cypress E2E tests
        if: steps.changes.outputs.frontend == 'true'
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run serve
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 60

      - name: Skip (no frontend changes)
        if: steps.changes.outputs.frontend != 'true'
        run: echo "No frontend-related changes detected."
